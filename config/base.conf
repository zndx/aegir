# Aegir base configuration (HOCON / pyhocon).
#
# Layering:
#   1. This file — defaults. Ports chosen to not conflict with sibling projects
#      on the same dev box (atelier 5533/6333/6334/8090/50051, gaius 5444/6339,
#      cybersec 5438, signals 5455).
#   2. Environment substitutions (${?VAR}) — set by devenv, .env, CAI runtime,
#      Kubernetes Secrets/ConfigMaps, or `just` recipe args.
#   3. Resolved artifacts — `bin/resolve-config.py` materializes
#      ``build/config/aegir.env`` (shell-sourceable) and
#      ``build/config/aegir.json`` (with redacted secrets, for BDD assertions).
#
# Deployment targets:
#   devenv    postgres@5555, qdrant@6355/6356, gateway@8091, runs at outputs/runs
#   CAI       PGlite@5545, gateway at $CDSW_APP_PORT, runs at .app/runs
#   Zarf K8s  postgres StatefulSet, qdrant StatefulSet, gateway via Ingress,
#             runs on PVC at /data/runs

aegir {
  # ── Web gateway (FastAPI) ────────────────────────────────────
  gateway {
    host = "0.0.0.0"
    host = ${?AEGIR_GATEWAY_HOST}
    port = 8091
    port = ${?AEGIR_GATEWAY_PORT}
    port = ${?CDSW_APP_PORT}   # CAI platform override takes precedence
  }

  # ── Database (Postgres / PGlite) ─────────────────────────────
  #
  # Local devenv: postgresql://localhost:5555/aegir (via services.postgres)
  # CAI:           postgresql://localhost:5545/postgres (PGlite on port 5545)
  # Zarf K8s:      postgresql://postgres-svc.aegir:5432/aegir (StatefulSet)
  db {
    url = "postgresql+psycopg://localhost:5555/aegir?sslmode=disable"
    url = ${?AEGIR_DB_URL}
  }

  # ── Qdrant vector store ──────────────────────────────────────
  #
  # Provisioned in M1 but not populated by the leaderboard. Reserved for
  # M2+ (column / sibling-column embedding similarity search).
  qdrant {
    host = "localhost"
    host = ${?QDRANT_HOST}
    http_port = 6355
    http_port = ${?QDRANT_HTTP_PORT}
    grpc_port = 6356
    grpc_port = ${?QDRANT_GRPC_PORT}
  }

  # ── Run artifacts ────────────────────────────────────────────
  runs {
    # Where RunArtifacts writes metadata/metrics/plots sidecars.
    # Gateway's /api/leaderboard scans this directory.
    dir = "outputs/runs"
    dir = ${?AEGIR_RUNS_DIR}
  }

  # ── Benchmark data ───────────────────────────────────────────
  data {
    # Default location of the cldr/signals GitTables drop (absolute).
    # Overridden per-fixture during BDD by AEGIR_BDD_FIXTURES.
    gittables_signals_dir = "/home/rch/local/src/cldr/signals/build/datasets/gittables"
    gittables_signals_dir = ${?AEGIR_GITTABLES_DIR}
  }

  # ── UI bundle ────────────────────────────────────────────────
  ui {
    # Location of built SPA that the gateway serves as /*.
    # Missing dir → gateway returns 404 with a hint (see BDD).
    dist_dir = "ui/dist"
    dist_dir = ${?AEGIR_UI_DIST}
  }

  # ── P5 GRPO/RLVR run artifacts ───────────────────────────────
  #
  # Mirrors aegir.rl.checkpointing.CheckpointConfig.output_dir so a
  # default-config gateway sees the artifacts of a default-config
  # training run with no extra wiring. The gateway's
  # /api/p5/runs lists checkpoint dirs; /api/p5/sae/stream is an
  # SSE stream of new SAE feature records as the trainer spills
  # them on each save event. Cross-worktree workflow: the training
  # process runs here, the UI runs in another worktree, both share
  # this directory via the filesystem.
  p5 {
    output_dir = "/raid/checkpoints/p5"
    output_dir = ${?AEGIR_P5_OUTPUT_DIR}
    # Per-checkpoint snapshot (point-in-time, on save).
    sae_log_filename = "sae_features.jsonl"
    # Live tail (run root, appended every ``sae_live_spill_every_n_steps``
    # GRPO steps). The SSE stream prefers this over per-checkpoint
    # snapshots when present, so the UI sees feature activity in
    # near-real-time rather than only on save.
    sae_live_log_filename = "sae_features.live.jsonl"
    metadata_filename = "aegir_metadata.json"
  }
}
