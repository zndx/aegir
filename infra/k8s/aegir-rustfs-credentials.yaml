# S3 credentials for the aegir Metaflow service plane: Signals' RustFS, reached in-cluster
# through the default-namespace Service devenv-rustfs (ClusterIP → tinybox 192.168.1.55:9010).
# Plain manifest (no envsubst) so it can be applied directly:
#   kubectl apply -f infra/k8s/aegir-rustfs-credentials.yaml
# The templated copy in aegir-services.yaml is what `tilt ci` renders; both carry the same values.
apiVersion: v1
kind: Secret
metadata:
  name: aegir-rustfs-credentials
  namespace: aegir-metaflow
  labels:
    app.kubernetes.io/part-of: aegir-metaflow
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
  AWS_ENDPOINT_URL_S3: http://devenv-rustfs.default.svc.cluster.local:9010
