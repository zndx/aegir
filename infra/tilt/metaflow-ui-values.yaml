# Rendered by scripts/metaflow/bootstrap.sh (envsubst) → build/metaflow/.
uiBackend:
  metadatadb:
    host: aegir-postgres
    port: "$PGPORT"
    user: metaflow
    password: "metaflow"
    name: metaflow
  metaflowDatastoreSysRootS3: "s3://aegir-metaflow/metaflow"
  # Signals' RustFS via the namespace-local host Endpoints (aegir-rustfs → tinybox :9010).
  metaflowS3EndpointURL: "http://aegir-rustfs:9010"
  image:
    name: public.ecr.aws/outerbounds/metaflow_metadata_service
    tag: "2.5.0"
  env:
    - name: AWS_ACCESS_KEY_ID
      value: $AEGIR_RUSTFS_ACCESS_KEY
    - name: AWS_SECRET_ACCESS_KEY
      value: $AEGIR_RUSTFS_SECRET_KEY
    - name: METAFLOW_CARD_S3ROOT
      value: "s3://aegir-metaflow/metaflow/cards"
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}
uiStatic:
  metaflowUIBackendURL: "http://$AEGIR_HOST_IP:9085/api"
  image:
    name: public.ecr.aws/outerbounds/metaflow_ui
    tag: v1.3.14
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}
