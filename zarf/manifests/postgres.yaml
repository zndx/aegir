apiVersion: v1
kind: Secret
metadata:
  name: aegir-postgres-credentials
  namespace: aegir
type: Opaque
stringData:
  POSTGRES_USER: aegir
  POSTGRES_PASSWORD: "###ZARF_VAR_POSTGRES_PASSWORD###"
  POSTGRES_DB: aegir
---
apiVersion: v1
kind: Service
metadata:
  name: aegir-postgres
  namespace: aegir
  labels:
    app: aegir-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      name: postgres
  selector:
    app: aegir-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegir-postgres
  namespace: aegir
spec:
  serviceName: aegir-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aegir-postgres
  template:
    metadata:
      labels:
        app: aegir-postgres
    spec:
      containers:
        - name: postgres
          # pgvector/pgvector:pg16 bundles the vector extension — the plain
          # postgres:16 image does not, and the migration's
          # CREATE EXTENSION vector would fail.
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: aegir-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, aegir, -d, aegir]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, aegir, -d, aegir]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "###ZARF_VAR_POSTGRES_PVC_SIZE###"
