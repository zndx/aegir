apiVersion: v1
kind: Service
metadata:
  name: aegir-qdrant
  namespace: aegir
  labels:
    app: aegir-qdrant
spec:
  type: ClusterIP
  ports:
    - port: 6355
      name: http
      targetPort: 6333
    - port: 6356
      name: grpc
      targetPort: 6334
  selector:
    app: aegir-qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegir-qdrant
  namespace: aegir
spec:
  serviceName: aegir-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: aegir-qdrant
  template:
    metadata:
      labels:
        app: aegir-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "###ZARF_VAR_QDRANT_PVC_SIZE###"
