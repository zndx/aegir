[project]
name = "aegir"
version = "0.2.0"
description = "Hierarchical Sequence Modeling with RWKV-7/8 and Dynamic Chunking"
readme = "README.md"
requires-python = "~=3.12.0"  # 3.12.x only; matches gaius's pin (giotto-tda not on 3.13+)
dependencies = [
    # ── Training hot path ────────────────────────────────────────
    "torch>=2.5.1",
    "triton>=3.2.0",
    "einops",
    "optree",
    "numpy",
    "flash-linear-attention>=0.4.2",
    "sentence-transformers",
    "scikit-learn",
    "pandas",
    "pyarrow>=15.0.0",       # parquet — gittables signals loader + future sidecar backfill
    "omegaconf",
    # ── Configuration ────────────────────────────────────────────
    "pyhocon>=0.3.63",
    # ── Gateway + leaderboard runtime ────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.49",
    "psycopg[binary]>=3.3.3",
    # ── Visualization (static Bokeh JSON emitted by train.py → read-only served by gateway) ─
    "holoviews>=1.18",
    "bokeh>=3.4",
    # ── BDD ──────────────────────────────────────────────────────
    "behave>=1.3.3",
    # ── Ontology / catalog construction (DeepOnto offline harness;
    # JVM-free at runtime per the procedural-catalog architecture) ─
    "deeponto>=0.9.0",
    "jpype1>=1.5",
    # ── GRPO/RLVR training (P5) ─────────────────────────────────
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "outlines>=0.1",
    "accelerate>=1.1",
    # ── Tokenizer backends ──────────────────────────────────────
    # Qwen3.5 ships a tiktoken-based BPE tokenizer; ``tiktoken`` is
    # required to instantiate it. ``sentencepiece`` + ``protobuf``
    # cover the SentencePiece/proto fallback path that some
    # transformers tokenizer-conversion code paths require.
    # Neither tiktoken nor sentencepiece is pulled as a transitive
    # dep of the transformers / trl packages, so we list them
    # explicitly.
    "tiktoken>=0.7",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "lm-format-enforcer>=0.11.3",
    # xgrammar: relaxed from >=0.2.0 to allow gaius's vllm (which pins
    # xgrammar to 0.1.27 or 0.1.29). 0.1.29 has the same logits-processor
    # factory API aegir uses in scripts/p5_rejection_sample.py.
    "xgrammar>=0.1.29",
    # huggingface-hub: relaxed from >=1.8.0 to allow gaius's transitive
    # circuit-tracer (which caps <1.0.0). All hf-hub usages in aegir are
    # the stable HfApi / hf_hub_download / whoami surface that's
    # compatible across major versions.
    "huggingface-hub",
    "gaius",
]

[project.optional-dependencies]
# ``flash`` / ``mamba`` are built from source with a patched CXX11 ABI
# flag (see CLAUDE.md). They are kept off the main dependency list so
# ``uv sync`` does not clobber the patched wheels each time. Install
# the patched versions manually per CLAUDE.md; do not activate these
# extras unless you specifically want uv to manage unpatched PyPI
# versions.
flash = ["flash-attn>=2.8.0"]
mamba = ["mamba-ssm", "causal-conv1d"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegir*"]

[tool.uv]
no-build-isolation-package = ["flash-attn", "mamba-ssm", "causal-conv1d"]
# Limit resolution to our actual deployment target. Without this uv
# tries to resolve for win32/python-3.14/etc., which makes the
# unified-env-with-gaius resolution intractable.
environments = [
    "sys_platform == 'linux' and python_version >= '3.12' and python_version < '3.13'",
]
# Adopt gaius's override-dependencies pattern so we share the same
# resolved environment. See gaius/pyproject.toml for rationale on each
# entry.
override-dependencies = [
    "peft>=0.18.0",
    # rapidocr wants opencv-python which needs libGL.so.1 (unavailable on Nix).
    # vLLM wants opencv-python-headless (no libGL). Having both installed causes
    # opencv-python to win the import and crash. Force headless everywhere.
    "opencv-python>=4.11 ; sys_platform == 'never'",
    # ninja pip package is a manylinux ELF binary linked against host glibc.
    # It picks up Nix libstdc++ (glibc 2.42) via LD_LIBRARY_PATH but runs against
    # host glibc (2.35), causing GLIBC_2.38 not found. devenv provides ninja via Nix
    # which is self-contained with its own glibc. Block the pip version.
    "ninja>=1.0 ; sys_platform == 'never'",
]
# torch / triton come from PyPI default index (cu128 build), matching
# gaius's lock. Patched flash-attn / mamba-ssm / causal-conv1d will be
# rebuilt against torch 2.9.x post-install.

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "packaging", "ninja", "psutil"]
mamba-ssm = ["torch", "packaging", "ninja", "psutil", "wheel"]
causal-conv1d = ["torch", "packaging", "ninja"]

[tool.uv.sources]
gaius = { path = "../gaius", editable = true }

[build-system]
requires = ["setuptools>=61.0.0", "wheel", "torch", "packaging", "ninja"]
build-backend = "setuptools.build_meta"
